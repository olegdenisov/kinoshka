# client-side (see AGENTS.md, "Error tracking (Sentry)") — same value already ships in
# every production JS bundle via VITE_SENTRY_DSN, so this is not a leaked secret.
regexes = ['''ba5e2436894e905aa0a71618112e7c1b''']
