name: Lighthouse CI

# Отдельный workflow (не job внутри ci.yml), тот же паттерн, что и e2e.yml —
# `on:` изолирован от общего pull_request-триггера ci.yml, иначе `types:
# [labeled]` там перезапускал бы lint/typecheck/test/build на каждое
# навешивание лейбла. Гоняем только по ручному запросу через лейбл
# `run-lighthouse` — прогон бьёт по живому demo-API (см. AGENTS.md) через
# реальные страницы Vercel preview и делит квоту 200 запросов/день с E2E.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    # Срабатывает именно на добавление лейбла run-lighthouse (не на любой
    # label-event) и не на форк-PR — vercel.json's ignoreCommand всё равно не
    # создаст preview-деплой для чужого коммита (см. план, Post-Completion),
    # и на форк-PR secrets.GITHUB_TOKEN имеет урезанные права.
    if: github.event.label.name == 'run-lighthouse' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      deployments: read
      statuses: read
    steps:
      # Нет setup-node/pnpm install — намеренно: treosh/lighthouse-ci-action
      # вендорит собственный @lhci/cli, ничего из package.json ему не нужно
      # (см. план, Context).
      - uses: actions/checkout@v7
        with:
          # github.event.pull_request.head.sha, а не github.ref — на
          # pull_request:labeled github.ref указывает на merge-ref PR, не на
          # ветку, к которой добавили лейбл (тот же прецедент, что в e2e.yml).
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for Vercel preview
        id: wait
        # v1.3.3 — запинена явно, не floating-тег v1: v1 у этого экшена
        # исторически отстаёт от последнего патча (проверено при подготовке
        # этой задачи — v1 резолвится в более старый коммит, чем v1.3.3).
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          # Deployment Protection на этом проекте РЕАЛЬНО включена —
          # подтверждено упавшим прогоном 35253656170, где этот шаг получил
          # 401 на все 150 попыток к preview URL и умер по таймауту (раньше
          # строка ниже была закомментирована «до подтверждения»).
          # Значение уходит в заголовок x-vercel-protection-bypass (см.
          # action.js:65-67 у v1.3.3) — тот же секрет и тот же заголовок, что
          # читает lighthouserc.cjs для самого Lighthouse ниже: это ДВЕ
          # независимые точки конфигурации (отдельный HTTP-клиент этого шага и
          # отдельный Chrome у lhci), одна другую не заменяет — починить надо
          # обе, иначе job просто переносит 401-стену на шаг ниже.
          #
          # ⚠️ Секрет VERCEL_PROTECTION_BYPASS в репозитории ещё НЕ заведён —
          # это требует доступа к Vercel Dashboard (Project Settings →
          # Deployment Protection → Protection Bypass for Automation) и к
          # GitHub Settings → Secrets, то есть действия человека, а не этого
          # workflow (см. AGENTS.md, "Lighthouse CI", список deferred-пунктов).
          # Пока секрет не заведён, оба места получают пустую строку и job
          # снова упрётся в 401 — это ожидаемо, не регресс конфига.
          vercel_protection_bypass_header: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

      - name: Run Lighthouse CI
        id: lhci
        # continue-on-error, чтобы шаг комментария выполнился и при упавших
        # assertion'ах — финальный шаг ниже фейлит job по steps.lhci.outcome.
        continue-on-error: true
        # v12 (сейчас резолвится в 12.6.2, последний релиз на момент
        # подготовки задачи) — floating major-тег, тот же принцип пиновки,
        # что уже принят в репо для официальных экшенов (actions/checkout@v7
        # и т.п., см. e2e.yml).
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ steps.wait.outputs.url }}
            ${{ steps.wait.outputs.url }}/search
            ${{ steps.wait.outputs.url }}/movie/666
            ${{ steps.wait.outputs.url }}/profile
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          # lighthouserc.cjs читает этот секрет через process.env и, только
          # если он непустой, добавляет collect.settings.extraHeaders с
          # x-vercel-protection-bypass — без него реальный Chrome у lhci бьёт
          # по тем же защищённым URL'ам и получает 401 (шаг wait выше свой
          # bypass получает отдельно и Lighthouse'у его не передаёт).
          # Секрет умышленно не навешивается на urls: выше query-параметром
          # `?x-vercel-protection-bypass=...`: URL'ы попадают в
          # steps.lhci.outputs.links, а те публикуются в открытом
          # PR-комментарии (.github/scripts/lighthouse-comment.cjs).
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}

      - name: Comment PR with results
        # !cancelled() (не bare always()) — шаг должен выполниться и когда
        # предыдущий "Wait for Vercel preview" упал (Deployment Protection,
        # таймаут), и когда упал/недошёл до assertion'ов lhci — именно это
        # утверждает комментарий-фолбэк ниже (см.
        # .github/scripts/lighthouse-comment.cjs). Раньше здесь не было
        # никакого if:, из-за чего шаг тихо пропускался при падении
        # "Wait for Vercel preview" и комментарий вообще не постился — вопреки
        # собственному назначению этого шага (найдено code review). Не bare
        # always() — чтобы не пытаться постить комментарий и при отмене джобы
        # самим GitHub Actions (concurrency: cancel-in-progress).
        if: ${{ !cancelled() }}
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./.github/scripts/lighthouse-comment.cjs')
            await run({ github, context })
        env:
          LHCI_LINKS: ${{ steps.lhci.outputs.links }}
          LHCI_ASSERTION_RESULTS: ${{ steps.lhci.outputs.assertionResults }}

      - name: Fail if Lighthouse assertions never ran
        # treosh/lighthouse-ci-action's main() явно проверяет exit code
        # collect/upload и падает при их ошибке (это уже покрыто следующим
        # шагом через outcome=='failure') — но exit code отдельного
        # `lhci assert` подпроцесса нигде не проверяется. Если assert упадёт
        # (ошибка конфига, версии, кинутое исключение внутри аудита) и не
        # напишет assertion-results.json, getAssertionResults() у экшена
        # вернёт null, setAnnotations() тихо не вызовет core.setFailed() — джоба
        # зазеленеет, хотя assertions вообще не запускались (найдено code
        # review). Отличаем этот случай от "все прогоны прошли чисто"
        # (assertionResults — валидный '[]', а не пустая строка/отсутствует):
        # падаем только когда links заполнен (collect/upload прошли), а
        # assertionResults пуст.
        if: steps.lhci.outputs.links != '' && steps.lhci.outputs.assertionResults == ''
        run: |
          echo "::error::Lighthouse CI produced report links but no assertion results — the assert step likely crashed without writing assertion-results.json. Treating this as a failure."
          exit 1

      - name: Fail on Lighthouse assertion failure
        # outcome (не conclusion) остаётся 'failure' при continue-on-error:
        # true — conclusion станет 'success' и не заметит провал.
        if: steps.lhci.outcome == 'failure'
        run: exit 1
