name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make audit

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make build-only
      - run: make size

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make knip

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make build-only
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # не секрет (просто хост региона), поэтому не в GitHub Secrets — см.
          # https://github.com/getsentry/sentry-cli/issues/3385: без явного url
          # org-токен региональных инстансов (us.sentry.io/de.sentry.io) 401-ит
          # на дефолтном sentry.io.
          SENTRY_URL: https://us.sentry.io

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    # job-level `on:` не существует в GitHub Actions — ограничение триггера
    # только через `if:`. Не гоняем на push:main (дублирует уже пройденную
    # PR-проверку, тратит квоту demo-API) и не гоняем на PR из форков
    # (secrets там недоступны — билд пройдёт, но VITE_API_KEY будет пустым
    # и все спеки упадут на 401/403; форки сознательно не поддерживаются).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      # matrix.shard обязателен в группе — без него все 4 шарда одного
      # прогона попадают в одну concurrency-группу, и cancel-in-progress
      # заставляет их отменять друг друга.
      group: e2e-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Безусловно (не только на cache miss) — кеш не покрывает системные
      # библиотеки, которые ставит --with-deps (apt-пакеты для WebKit и
      # т.п.); playwright install сам пропускает повторную загрузку уже
      # закешированных бинарников браузеров.
      - run: make e2e-install
      - run: make build-only
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          # не секрет (публичный API-хост, см. .env.example), тот же
          # прецедент, что уже принят для SENTRY_URL в build-job'е.
          VITE_BASE_URL: https://api.poiskkino.dev
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
