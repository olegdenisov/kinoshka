name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Временный стоп-кран: ветки rtk, zustand и reatom не должны попасть в main, пока миграции не
  # готовы. Job обязателен в ruleset protect-main, поэтому падение блокирует
  # merge. Чтобы разрешить слияние — убрать ветку из BLOCKED_BRANCHES.
  branch-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block merging protected-from-merge branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BLOCKED_BRANCHES: rtk zustand reatom
        run: |
          for branch in $BLOCKED_BRANCHES; do
            if [ "$HEAD_REF" = "$branch" ]; then
              echo "::error::Branch '$branch' is blocked from merging into main"
              exit 1
            fi
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make audit

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make build-only
      - run: make size

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make knip

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: make build-only
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # не секрет (просто хост региона), поэтому не в GitHub Secrets — см.
          # https://github.com/getsentry/sentry-cli/issues/3385: без явного url
          # org-токен региональных инстансов (us.sentry.io/de.sentry.io) 401-ит
          # на дефолтном sentry.io.
          SENTRY_URL: https://us.sentry.io
